name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Auto-Fix Project Structure
      run: |
        mkdir -p clean_app/app/src/main/assets
        mkdir -p clean_app/app/src/main/res/xml
        mkdir -p clean_app/app/src/main/java/com/gurugyanora/dragonwallpaper

        # dragon.html को ढूंढकर सही जगह रखना
        HTML_FILE=$(find . -name "dragon.html" | head -n 1)
        if [ -n "$HTML_FILE" ]; then cp "$HTML_FILE" clean_app/app/src/main/assets/dragon.html; fi

        cat << 'EOF' > clean_app/settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DragonLiveWallpaper"
        include ':app'
        EOF

        cat << 'EOF' > clean_app/build.gradle
        plugins {
            id 'com.android.application' version '8.5.0' apply false
        }
        EOF

        cat << 'EOF' > clean_app/gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > clean_app/app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.gurugyanora.dragonwallpaper'
            compileSdk 34
            defaultConfig {
                applicationId "com.gurugyanora.dragonwallpaper"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.7.0'
        }
        EOF

        cat << 'EOF' > clean_app/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
            <application
                android:allowBackup="true"
                android:label="Interactive Dragon"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <service
                    android:name=".DragonWallpaperService"
                    android:enabled="true"
                    android:exported="true"
                    android:label="Interactive Dragon"
                    android:permission="android.permission.BIND_WALLPAPER">
                    <intent-filter>
                        <action android:name="android.service.wallpaper.WallpaperService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.service.wallpaper"
                        android:resource="@xml/wallpaper" />
                </service>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > clean_app/app/src/main/res/xml/wallpaper.xml
        <?xml version="1.0" encoding="utf-8"?>
        <wallpaper xmlns:android="http://schemas.android.com/apk/res/android" />
        EOF

        cat << 'EOF' > clean_app/app/src/main/java/com/gurugyanora/dragonwallpaper/DragonWallpaperService.java
        package com.gurugyanora.dragonwallpaper;

        import android.graphics.Canvas;
        import android.os.Handler;
        import android.os.Looper;
        import android.service.wallpaper.WallpaperService;
        import android.view.MotionEvent;
        import android.view.SurfaceHolder;
        import android.view.View;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class DragonWallpaperService extends WallpaperService {
            @Override
            public Engine onCreateEngine() {
                return new DragonEngine();
            }

            private class DragonEngine extends Engine {
                private WebView webView;
                private final Handler handler = new Handler(Looper.getMainLooper());
                private boolean visible = false;

                private final Runnable drawRunner = new Runnable() {
                    @Override
                    public void run() {
                        drawFrame();
                    }
                };

                @Override
                public void onCreate(SurfaceHolder surfaceHolder) {
                    super.onCreate(surfaceHolder);
                    setTouchEventsEnabled(true);
                    webView = new WebView(DragonWallpaperService.this);
                    WebSettings settings = webView.getSettings();
                    settings.setJavaScriptEnabled(true);
                    settings.setDomStorageEnabled(true);
                    webView.setWebViewClient(new WebViewClient());
                    webView.loadUrl("file:///android_asset/dragon.html");
                }

                @Override
                public void onSurfaceChanged(SurfaceHolder holder, int format, int width, int height) {
                    super.onSurfaceChanged(holder, format, width, height);
                    webView.measure(
                        View.MeasureSpec.makeMeasureSpec(width, View.MeasureSpec.EXACTLY),
                        View.MeasureSpec.makeMeasureSpec(height, View.MeasureSpec.EXACTLY)
                    );
                    webView.layout(0, 0, width, height);
                }

                @Override
                public void onTouchEvent(MotionEvent event) {
                    super.onTouchEvent(event);
                    if (webView != null) {
                        webView.dispatchTouchEvent(event);
                    }
                }

                @Override
                public void onVisibilityChanged(boolean visible) {
                    this.visible = visible;
                    if (visible) {
                        handler.post(drawRunner);
                    } else {
                        handler.removeCallbacks(drawRunner);
                    }
                }

                private void drawFrame() {
                    SurfaceHolder holder = getSurfaceHolder();
                    Canvas canvas = null;
                    try {
                        canvas = holder.lockCanvas();
                        if (canvas != null && webView != null) {
                            webView.draw(canvas);
                        }
                    } finally {
                        if (canvas != null) {
                            holder.unlockCanvasAndPost(canvas);
                        }
                    }
                    handler.removeCallbacks(drawRunner);
                    if (visible) {
                        handler.postDelayed(drawRunner, 16);
                    }
                }

                @Override
                public void onDestroy() {
                    super.onDestroy();
                    handler.removeCallbacks(drawRunner);
                    if (webView != null) {
                        webView.destroy();
                    }
                }
            }
        }
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      working-directory: clean_app
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Interactive-Dragon-Wallpaper
        path: clean_app/app/build/outputs/apk/debug/app-debug.apk
