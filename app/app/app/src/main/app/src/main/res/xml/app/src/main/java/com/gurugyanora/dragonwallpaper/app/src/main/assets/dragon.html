<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spider Clock Live Wallpaper (SHIV Edition)</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* सबसे नीचे: बैकग्राउंड कलर */
            background: radial-gradient(
                circle at 50% 50%,
                #180902 0%,
                #361504 14%,
                #8c3b00 34%,
                #753000 50%,
                #451b00 72%,
                #1f0b00 88%,
                #0e0500 100%
            );
        }

        /* लेयर 1: बैकग्राउंड के जस्ट ऊपर स्थिर कर्व नाम 'SHIV' (जीव से भी नीचे) */
        #nameLayerWrapper {
            position: fixed;
            width: 92vmin;
            height: 92vmin;
            max-width: 440px;
            max-height: 440px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            pointer-events: none;
        }

        svg#curvedNameSvg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .shiv-curved-text {
            font-family: 'Cinzel Decorative', Georgia, serif;
            font-weight: 900;
            font-size: 23px;
            letter-spacing: 7px;
            fill: url(#shivGoldGrad);
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.65));
            opacity: 0.78;
        }

        /* लेयर 2: रेंगता हुआ 108-टांगों वाला जीव ('SHIV' से ऊपर, घड़ी से नीचे) */
        canvas#centipedeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            opacity: 0.90;
            pointer-events: none;
        }

        /* लेयर 3: घड़ी और रिंग का कंटेनर (जीव से ऊपर) */
        #watchWrapper {
            position: relative;
            width: 92vmin;
            height: 92vmin;
            max-width: 440px;
            max-height: 440px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            pointer-events: none;
        }

        /* 5% ओपेसिटी वाली रिंग और डॉट्स */
        .outer-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spinWheel 12s linear infinite;
            pointer-events: none;
            z-index: 2;
            opacity: 0.05;
        }

        @keyframes spinWheel {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .main-ring {
            position: absolute;
            width: 80%;
            height: 80%;
            border: 5px solid #ffffff;
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
        }

        .dot-arm {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(calc(var(--i) * 30deg));
            pointer-events: none;
        }

        .dot {
            position: absolute;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: 0 0 0 2.6px #421900;
        }

        body.auto-mode .dot-arm {
            animation: armDepth 2.4s infinite linear;
            animation-delay: calc(var(--i) * -0.2s);
        }

        body.auto-mode .dot {
            animation: dotOrbit 2.4s infinite ease-in-out;
            animation-delay: calc(var(--i) * -0.2s);
        }

        @keyframes armDepth {
            0%, 49% { z-index: 3; }
            50%, 100% { z-index: 1; }
        }

        @keyframes dotOrbit {
            0% {
                transform: translateY(-33vmin) scale(0.68);
            }
            50% {
                transform: translateY(-44vmin) scale(1.0);
            }
            100% {
                transform: translateY(-33vmin) scale(0.68);
            }
        }

        @media (min-width: 480px) and (min-height: 480px) {
            @keyframes dotOrbit {
                0% {
                    transform: translateY(-158px) scale(0.68);
                }
                50% {
                    transform: translateY(-210px) scale(1.0);
                }
                100% {
                    transform: translateY(-158px) scale(0.68);
                }
            }
        }

        /* मकड़ी वाली घड़ी (100% फुल साइज) */
        svg#spiderWatch {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: visible;
            z-index: 5;
        }

        .spider-part {
            fill: #ffffff;
            stroke: none;
        }
        .spider-leg-static {
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.3px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .articulated-leg {
            fill: #ffffff;
            stroke: none;
        }
        .joint-dot {
            fill: #ffffff;
            stroke: none;
        }
        .spider-web-silk {
            fill: none;
            stroke: #ffffff;
            stroke-width: 0.75px;
            opacity: 0.34;
            stroke-linecap: round;
        }
        .gear-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.25px;
            opacity: 0.66;
        }
        .clock-number {
            fill: #ffffff;
            stroke: #111111;
            stroke-width: 0.9px;
            paint-order: stroke fill;
            font-family: 'Caveat', 'Dancing Script', 'Segoe Script', 'Comic Sans MS', cursive, serif;
            font-style: italic;
            font-size: 22px;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: central;
            opacity: 0.95;
        }
        .web-line {
            stroke: #ffffff;
            stroke-width: 1.35px;
            opacity: 0.88;
        }

        /* लेयर 4: सबसे ऊपर लटकते हुए रेशमी धागे */
        canvas#threadsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body class="auto-mode">

<!-- लेयर 1: बैकग्राउंड के जस्ट ऊपर स्थिर कर्व नाम 'SHIV' (10 से 2 के बीच, घड़ी के बाहर) -->
<div id="nameLayerWrapper">
    <svg id="curvedNameSvg" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- 10 बजे (-148°) से 2 बजे (-32°) तक घड़ी के नंबरों के बाहर कर्व पाथ -->
            <path id="shivArc" d="M 26,76.3 A 158,158 0 0,1 294,76.3" />
            <linearGradient id="shivGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#e6b88a" />
                <stop offset="50%" stop-color="#fff0db" />
                <stop offset="100%" stop-color="#e6b88a" />
            </linearGradient>
        </defs>
        <text class="shiv-curved-text">
            <textPath href="#shivArc" startOffset="50%" text-anchor="middle">SHIV</textPath>
        </text>
    </svg>
</div>

<!-- लेयर 2: 108-टांगों वाला रेंगता हुआ जीव -->
<canvas id="centipedeCanvas"></canvas>

<!-- लेयर 3: रिंग-डॉट्स और मकड़ी वाली घड़ी -->
<div id="watchWrapper">
    <div class="outer-scene" id="scene">
        <div class="main-ring"></div>
        <div class="dot-arm" style="--i:0;"><div class="dot"></div></div>
        <div class="dot-arm" style="--i:1;"><div class="dot"></div></div>
        <div class="dot-arm" style="--i:2;"><div class="dot"></div></div>
        <div class="dot-arm" style="--i:3;"><div class="dot"></div></div>
        <div class="dot-arm" style="--i:4;"><div class="dot"></div></div>
        <div class="dot-arm" style="--i:5;"><div class="dot"></div></div>
        <div class="dot-arm" style="--i:6;"><div class="dot"></div></div>
        <div class="dot-arm" style="--i:7;"><div class="dot"></div></div>
        <div class="dot-arm" style="--i:8;"><div class="dot"></div></div>
        <div class="dot-arm" style="--i:9;"><div class="dot"></div></div>
        <div class="dot-arm" style="--i:10;"><div class="dot"></div></div>
        <div class="dot-arm" style="--i:11;"><div class="dot"></div></div>
    </div>

    <svg id="spiderWatch" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
        <line x1="160" y1="-450" x2="160" y2="160" class="web-line" />
        <g id="spiderWebLayer"></g>

        <g id="gearsLayer">
            <g id="gearA" transform="translate(122, 142)"></g>
            <g id="gearB" transform="translate(198, 144)"></g>
            <g id="gearC" transform="translate(136, 192)"></g>
            <g id="gearD" transform="translate(184, 190)"></g>
            <g id="gearE" transform="translate(160, 124)"></g>
        </g>

        <g id="numbersLayer"></g>

        <g id="spiderCenter" transform="translate(160, 160)">
            <g class="spider-leg-static">
                <path d="M -6,-5 L -18,-22 L -28,-16 L -35,-4" />
                <path d="M -7,0 L -22,-8 L -34,2 L -42,16" />
                <path d="M -5,5 L -16,18 L -25,30 L -28,44" />
                <path d="M 6,-5 L 18,-22 L 28,-16 L 35,-4" />
                <path d="M 5,5 L 16,18 L 25,30 L 28,44" />
            </g>

            <g id="handHour">
                <path id="hourPath" class="articulated-leg" d="" />
            </g>

            <g id="handMinute">
                <path id="minPath" class="articulated-leg" d="" />
            </g>

            <g id="handSecond">
                <path id="secPath" class="articulated-leg" d="" />
                <circle id="secJ1" r="1.5" class="joint-dot" />
                <circle id="secJ2" r="1.3" class="joint-dot" />
                <circle id="secJ3" r="1.0" class="joint-dot" />
            </g>

            <g class="spider-part">
                <circle cx="0" cy="-7" r="7" />
                <ellipse cx="0" cy="9" rx="9.5" ry="13.5" />
                <path d="M -2.2,-13 L -4.2,-20" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
                <path d="M 2.2,-13 L 4.2,-20" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
            </g>
        </g>
    </svg>
</div>

<!-- लेयर 4: ऊपर से लटकते हुए धागे -->
<canvas id="threadsCanvas"></canvas>

<script>
    /* =========================================================================
       1. 108-टांगों वाला रेंगता हुआ जीव (95% स्केल और 90% ओपेसिटी)
       ========================================================================= */
    (() => {
        const canvas = document.getElementById('centipedeCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const CREATURE_SCALE = 0.95;
        const LEG_SEGMENTS = 54; 
        const TAIL_SEGMENTS = 18;
        const N = 1 + LEG_SEGMENTS + TAIL_SEGMENTS;
        const segDist = 7.5 * CREATURE_SCALE;

        const elems = [];
        const pointer = { x: width / 2 + 120, y: height / 2 };
        let walkPhase = 0;

        window.addEventListener('pointermove', (e) => {
            pointer.x = e.clientX;
            pointer.y = e.clientY;
        });

        for (let i = 0; i < N; i++) {
            elems[i] = { x: width / 2 - i * segDist, y: height / 2 };
        }

        function run() {
            requestAnimationFrame(run);
            ctx.clearRect(0, 0, width, height);

            let head = elems[0];
            const dx = pointer.x - head.x;
            const dy = pointer.y - head.y;
            const dist = Math.hypot(dx, dy);

            const headAngle = Math.atan2(dy, dx);

            let moveSpeed = 0;
            if (dist > 6) {
                moveSpeed = Math.min(dist * 0.08, 7.5);
                const slither = Math.sin(walkPhase * 0.6) * Math.min(dist * 0.03, 1.8);
                const perpAngle = headAngle + Math.PI / 2;

                head.x += Math.cos(headAngle) * moveSpeed + Math.cos(perpAngle) * slither * 0.25;
                head.y += Math.sin(headAngle) * moveSpeed + Math.sin(perpAngle) * slither * 0.25;

                walkPhase += moveSpeed * 0.16;
            }

            for (let i = 1; i < N; i++) {
                let curr = elems[i];
                let prev = elems[i - 1];
                const angle = Math.atan2(prev.y - curr.y, prev.x - curr.x);

                curr.x = prev.x - Math.cos(angle) * segDist;
                curr.y = prev.y - Math.sin(angle) * segDist;
            }

            // 1. पहले 108 वर्किंग टांगें
            for (let i = 1; i <= LEG_SEGMENTS; i++) {
                let curr = elems[i];
                let prev = elems[i - 1];
                const angle = Math.atan2(prev.y - curr.y, prev.x - curr.x);

                const legScale = Math.sin((i / (LEG_SEGMENTS + 4)) * Math.PI * 0.85 + 0.25);
                const upperLen = (14 * legScale + 6) * CREATURE_SCALE;
                const lowerLen = (16 * legScale + 6) * CREATURE_SCALE;

                const waveLeft = Math.sin(walkPhase - i * 0.45);
                const waveRight = Math.sin(walkPhase - i * 0.45 + Math.PI);

                ctx.save();
                ctx.translate(curr.x, curr.y);
                ctx.rotate(angle);

                drawCentipedeLeg(ctx, -1, waveLeft, upperLen, lowerLen, legScale * CREATURE_SCALE);
                drawCentipedeLeg(ctx, 1, waveRight, upperLen, lowerLen, legScale * CREATURE_SCALE);

                ctx.restore();
            }

            // 2. पूंछ की नोक के दो लंबे एंटीना
            let tailTip = elems[N - 1];
            let beforeTail = elems[N - 2];
            const tailAngle = Math.atan2(beforeTail.y - tailTip.y, beforeTail.x - tailTip.x);
            ctx.save();
            ctx.translate(tailTip.x, tailTip.y);
            ctx.rotate(tailAngle);
            ctx.scale(CREATURE_SCALE, CREATURE_SCALE);
            ctx.strokeStyle = '#1a110b';
            ctx.lineWidth = 1.4;
            for (let side of [-1, 1]) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(-18, side * 8, -36, side * (12 + Math.sin(walkPhase * 0.5) * 3));
                ctx.stroke();
            }
            ctx.restore();

            // 3. पूंछ से लेकर गर्दन तक शरीर के खंड
            for (let i = N - 1; i >= 1; i--) {
                let curr = elems[i];
                let prev = elems[i - 1];
                const angle = Math.atan2(prev.y - curr.y, prev.x - curr.x);

                let radius;
                if (i <= LEG_SEGMENTS) {
                    const p = i / LEG_SEGMENTS;
                    radius = (8.5 - p * 3.5) * CREATURE_SCALE;
                } else {
                    const tp = (i - LEG_SEGMENTS) / TAIL_SEGMENTS;
                    radius = (5 * (1 - tp * 0.85) + 0.8) * CREATURE_SCALE;
                }

                ctx.save();
                ctx.translate(curr.x, curr.y);
                ctx.rotate(angle);

                const grad = ctx.createRadialGradient(0, -radius * 0.2, radius * 0.1, 0, 0, radius);
                grad.addColorStop(0, '#5c3a21');
                grad.addColorStop(0.7, '#26170d');
                grad.addColorStop(1, '#0d0805');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, radius * 1.15, radius, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 200, 150, 0.18)';
                ctx.lineWidth = 0.8 * CREATURE_SCALE;
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.85, -Math.PI / 2, Math.PI / 2);
                ctx.stroke();

                ctx.restore();
            }

            // 4. मकड़ी जैसा चेहरा और चेहरे की बड़ी टांगें
            drawSpiderHead(ctx, head.x, head.y, headAngle, walkPhase, moveSpeed, CREATURE_SCALE);
        }

        function drawCentipedeLeg(ctx, side, wave, upperLen, lowerLen, scale) {
            const swing = wave * 0.45;
            const baseAngle = side * (Math.PI / 2.2) + swing;

            const kneeX = Math.cos(baseAngle) * upperLen;
            const kneeY = Math.sin(baseAngle) * upperLen;

            const footAngle = baseAngle + side * (0.55 - wave * 0.2);
            const footX = kneeX + Math.cos(footAngle) * lowerLen;
            const footY = kneeY + Math.sin(footAngle) * lowerLen;

            ctx.strokeStyle = '#1f1209';
            ctx.lineWidth = 1.4 * scale + 0.6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(0, side * 3 * CREATURE_SCALE);
            ctx.lineTo(kneeX, kneeY);
            ctx.lineTo(footX, footY);
            ctx.stroke();
        }

        function drawSpiderHead(ctx, x, y, angle, phase, speed, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.scale(scale, scale);

            const twitch = speed > 0.1 ? Math.sin(phase * 1.5) * 0.18 : Math.sin(Date.now() * 0.004) * 0.05;

            ctx.strokeStyle = '#140c07';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (let side of [-1, 1]) {
                const a1 = side * (0.65 + twitch * side);
                const j1x = 8 + Math.cos(a1) * 26;
                const j1y = side * 6 + Math.sin(a1) * 26;
                const t1x = j1x + Math.cos(a1 - side * 0.55) * 28;
                const t1y = j1y + Math.sin(a1 - side * 0.55) * 28;

                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(6, side * 6);
                ctx.lineTo(j1x, j1y);
                ctx.lineTo(t1x, t1y);
                ctx.stroke();

                const a2 = side * (1.15 - twitch * side);
                const j2x = 3 + Math.cos(a2) * 24;
                const j2y = side * 7 + Math.sin(a2) * 24;
                const t2x = j2x + Math.cos(a2 - side * 0.45) * 26;
                const t2y = j2y + Math.sin(a2 - side * 0.45) * 26;

                ctx.lineWidth = 2.1;
                ctx.beginPath();
                ctx.moveTo(2, side * 7);
                ctx.lineTo(j2x, j2y);
                ctx.lineTo(t2x, t2y);
                ctx.stroke();
            }

            ctx.fillStyle = '#0a0503';
            ctx.beginPath();
            ctx.moveTo(14, -4);
            ctx.quadraticCurveTo(24, -5, 22, -1);
            ctx.lineTo(14, -1);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(14, 4);
            ctx.quadraticCurveTo(24, 5, 22, 1);
            ctx.lineTo(14, 1);
            ctx.fill();

            const headGrad = ctx.createRadialGradient(2, 0, 2, 0, 0, 16);
            headGrad.addColorStop(0, '#4a2e1b');
            headGrad.addColorStop(0.75, '#1c1008');
            headGrad.addColorStop(1, '#080402');

            ctx.fillStyle = headGrad;
            ctx.beginPath();
            ctx.ellipse(3, 0, 14, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff3b30';
            ctx.beginPath();
            ctx.arc(13, -3.2, 2.1, 0, Math.PI * 2);
            ctx.arc(13, 3.2, 2.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff9500';
            ctx.beginPath();
            ctx.arc(10.5, -6.5, 1.3, 0, Math.PI * 2);
            ctx.arc(10.5, 6.5, 1.3, 0, Math.PI * 2);
            ctx.arc(7, -8.5, 1.1, 0, Math.PI * 2);
            ctx.arc(7, 8.5, 1.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        run();
    })();


    /* =========================================================================
       2. मकड़ी वाली घड़ी और 5% ओपेसिटी रिंग-डॉट्स का कोड
       ========================================================================= */
    (() => {
        const svgNS = "http://www.w3.org/2000/svg";

        function createGearSVG(parentGroup, outerRadius, innerRadius, teethCount) {
            let d = "";
            const step = (Math.PI * 2) / teethCount;
            for (let i = 0; i < teethCount; i++) {
                const a1 = i * step;
                const a2 = a1 + step * 0.25;
                const a3 = a1 + step * 0.5;
                const a4 = a1 + step * 0.75;

                const x1 = Math.cos(a1) * innerRadius, y1 = Math.sin(a1) * innerRadius;
                const x2 = Math.cos(a2) * outerRadius, y2 = Math.sin(a2) * outerRadius;
                const x3 = Math.cos(a3) * outerRadius, y3 = Math.sin(a3) * outerRadius;
                const x4 = Math.cos(a4) * innerRadius, y4 = Math.sin(a4) * innerRadius;

                d += (i === 0 ? `M ${x1},${y1} ` : `L ${x1},${y1} `);
                d += `L ${x2},${y2} L ${x3},${y3} L ${x4},${y4} `;
            }
            d += "Z";

            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("d", d);
            path.setAttribute("class", "gear-path");
            parentGroup.appendChild(path);

            const midCircle = document.createElementNS(svgNS, "circle");
            midCircle.setAttribute("r", innerRadius * 0.65);
            midCircle.setAttribute("class", "gear-path");
            parentGroup.appendChild(midCircle);

            const hubCircle = document.createElementNS(svgNS, "circle");
            hubCircle.setAttribute("r", innerRadius * 0.22);
            hubCircle.setAttribute("class", "gear-path");
            parentGroup.appendChild(hubCircle);

            for (let s = 0; s < 6; s++) {
                const sa = (s * Math.PI) / 3;
                const line = document.createElementNS(svgNS, "line");
                line.setAttribute("x1", Math.cos(sa) * (innerRadius * 0.22));
                line.setAttribute("y1", Math.sin(sa) * (innerRadius * 0.22));
                line.setAttribute("x2", Math.cos(sa) * (innerRadius * 0.65));
                line.setAttribute("y2", Math.sin(sa) * (innerRadius * 0.65));
                line.setAttribute("class", "gear-path");
                parentGroup.appendChild(line);
            }
        }

        createGearSVG(document.getElementById("gearA"), 32, 27, 20);
        createGearSVG(document.getElementById("gearB"), 30, 25, 18);
        createGearSVG(document.getElementById("gearC"), 22, 18, 14);
        createGearSVG(document.getElementById("gearD"), 24, 20, 16);
        createGearSVG(document.getElementById("gearE"), 18, 14, 12);

        const spiderWebLayer = document.getElementById("spiderWebLayer");
        const cx = 160, cy = 160;
        const numSpokes = 12;
        const spokeAngles = [];

        for (let i = 0; i < numSpokes; i++) {
            const angle = (i * 30 - 90) * (Math.PI / 180);
            spokeAngles.push(angle);

            const line = document.createElementNS(svgNS, "line");
            line.setAttribute("x1", cx);
            line.setAttribute("y1", cy);
            line.setAttribute("x2", cx + Math.cos(angle) * 116);
            line.setAttribute("y2", cy + Math.sin(angle) * 116);
            line.setAttribute("class", "spider-web-silk");
            spiderWebLayer.appendChild(line);
        }

        const ringRadii = [28, 48, 68, 88, 108];
        ringRadii.forEach((r) => {
            let webD = "";
            for (let i = 0; i < numSpokes; i++) {
                const a1 = spokeAngles[i];
                const a2 = spokeAngles[(i + 1) % numSpokes];
                const aMid = (a1 + a2) / 2 + (i === numSpokes - 1 ? Math.PI : 0);

                const x1 = cx + Math.cos(a1) * r;
                const y1 = cy + Math.sin(a1) * r;
                const x2 = cx + Math.cos(a2) * r;
                const y2 = cy + Math.sin(a2) * r;

                const sagR = r * 0.91;
                const ctrlX = cx + Math.cos(aMid) * sagR;
                const ctrlY = cy + Math.sin(aMid) * sagR;

                if (i === 0) webD += `M ${x1},${y1} `;
                webD += `Q ${ctrlX},${ctrlY} ${x2},${y2} `;
            }
            const webRing = document.createElementNS(svgNS, "path");
            webRing.setAttribute("d", webD);
            webRing.setAttribute("class", "spider-web-silk");
            spiderWebLayer.appendChild(webRing);
        });

        const numbersLayer = document.getElementById("numbersLayer");
        for (let i = 1; i <= 12; i++) {
            const angle = (i * 30 - 90) * (Math.PI / 180);
            const nx = 160 + Math.cos(angle) * 128;
            const ny = 160 + Math.sin(angle) * 128;

            const text = document.createElementNS(svgNS, "text");
            text.setAttribute("x", nx);
            text.setAttribute("y", ny);
            text.setAttribute("class", "clock-number");
            text.setAttribute("transform", `rotate(${Math.sin(i) * 5} ${nx} ${ny})`);
            text.textContent = i;
            numbersLayer.appendChild(text);
        }

        function buildArticulatedLeg(p0, p1, p2, p3, p4, baseWidth) {
            return `
                M ${p0.x - baseWidth},${p0.y}
                L ${p1.x - baseWidth * 0.85},${p1.y}
                L ${p2.x - baseWidth * 0.65},${p2.y}
                L ${p3.x - baseWidth * 0.4},${p3.y}
                L ${p4.x},${p4.y}
                L ${p3.x + baseWidth * 0.4},${p3.y}
                L ${p2.x + baseWidth * 0.65},${p2.y}
                L ${p1.x + baseWidth * 0.85},${p1.y}
                L ${p0.x + baseWidth},${p0.y}
                Z
            `;
        }

        const handHour = document.getElementById("handHour");
        const handMinute = document.getElementById("handMinute");
        const handSecond = document.getElementById("handSecond");

        const hourPath = document.getElementById("hourPath");
        const minPath = document.getElementById("minPath");
        const secPath = document.getElementById("secPath");

        const secJ1 = document.getElementById("secJ1");
        const secJ2 = document.getElementById("secJ2");
        const secJ3 = document.getElementById("secJ3");

        const gearA = document.getElementById("gearA");
        const gearB = document.getElementById("gearB");
        const gearC = document.getElementById("gearC");
        const gearD = document.getElementById("gearD");
        const gearE = document.getElementById("gearE");

        hourPath.setAttribute("d", buildArticulatedLeg(
            { x: 0, y: 0 },
            { x: -5, y: -18 },
            { x: 3, y: -36 },
            { x: -2, y: -52 },
            { x: 0, y: -66 },
            3.2
        ));

        minPath.setAttribute("d", buildArticulatedLeg(
            { x: 0, y: 0 },
            { x: -6, y: -25 },
            { x: 4, y: -52 },
            { x: -3, y: -76 },
            { x: 0, y: -96 },
            2.6
        ));

        let rot = 0;

        function updateClock() {
            const now = new Date();
            const ms = now.getMilliseconds();
            const rawSec = now.getSeconds();
            const frac = ms / 1000;

            let stepProgress = 0;
            let jointFlex = 0;

            if (frac < 0.28) {
                const t = frac / 0.28;
                stepProgress = 1 - Math.pow(1 - t, 3) * Math.cos(t * Math.PI * 1.5);
                jointFlex = Math.sin(t * Math.PI * 2.5) * (1 - t);
            } else {
                stepProgress = 1;
                jointFlex = Math.sin((frac - 0.28) * Math.PI * 2) * 0.08;
            }

            const currentSecPos = rawSec + stepProgress;
            const minutes = now.getMinutes() + (rawSec + frac) / 60;
            const hours = (now.getHours() % 12) + minutes / 60;

            const p0 = { x: 0, y: 0 };
            const p1 = { x: -4.5 - jointFlex * 7.5, y: -28 };
            const p2 = { x: 4.5 + jointFlex * 9.5,  y: -58 };
            const p3 = { x: -3.5 - jointFlex * 6.5, y: -86 };
            const p4 = { x: 0 + jointFlex * 2.0,    y: -114 };

            secPath.setAttribute("d", buildArticulatedLeg(p0, p1, p2, p3, p4, 2.0));

            secJ1.setAttribute("cx", p1.x); secJ1.setAttribute("cy", p1.y);
            secJ2.setAttribute("cx", p2.x); secJ2.setAttribute("cy", p2.y);
            secJ3.setAttribute("cx", p3.x); secJ3.setAttribute("cy", p3.y);

            handSecond.setAttribute("transform", `rotate(${currentSecPos * 6})`);
            handMinute.setAttribute("transform", `rotate(${minutes * 6})`);
            handHour.setAttribute("transform", `rotate(${hours * 30})`);

            rot += 0.28 + Math.abs(jointFlex) * 0.6;
            gearA.setAttribute("transform", `translate(122, 142) rotate(${rot})`);
            gearB.setAttribute("transform", `translate(198, 144) rotate(${-rot * 1.11})`);
            gearC.setAttribute("transform", `translate(136, 192) rotate(${-rot * 1.42})`);
            gearD.setAttribute("transform", `translate(184, 190) rotate(${rot * 1.25})`);
            gearE.setAttribute("transform", `translate(160, 124) rotate(${-rot * 1.66})`);

            requestAnimationFrame(updateClock);
        }

        updateClock();

        const wrapper = document.getElementById('watchWrapper');
        const arms = document.querySelectorAll('.dot-arm');
        const dots = document.querySelectorAll('.dot');
        const totalDots = dots.length;
        let prevDistances = new Array(totalDots).fill(0);
        let tiltTimeout;

        window.addEventListener('deviceorientation', (e) => {
            if (e.beta === null || e.gamma === null) return;

            let tiltX = e.gamma;
            let tiltY = e.beta - 45;
            let strength = Math.min(Math.hypot(tiltX, tiltY) / 35, 1);

            if (strength < 0.12) return;

            document.body.classList.remove('auto-mode');
            clearTimeout(tiltTimeout);

            const radius = wrapper.offsetWidth / 2;
            const innerDist = radius * 0.72;
            const outerDist = radius * 0.95;
            const midDist = (innerDist + outerDist) / 2;
            const swing = (outerDist - innerDist) / 2;

            let tiltAngle = Math.atan2(tiltX, -tiltY) * (180 / Math.PI);
            if (tiltAngle < 0) tiltAngle += 360;

            dots.forEach((dot, idx) => {
                let dotAngle = idx * (360 / totalDots);
                let diff = Math.abs(tiltAngle - dotAngle);
                if (diff > 180) diff = 360 - diff;

                let factor = Math.cos((diff * Math.PI) / 180);
                let targetDist = -(midDist + (factor * swing * strength));
                let scale = 0.84 + (factor * 0.16 * strength);

                if (targetDist < prevDistances[idx]) {
                    arms[idx].style.zIndex = '3';
                } else if (targetDist > prevDistances[idx]) {
                    arms[idx].style.zIndex = '1';
                }

                prevDistances[idx] = targetDist;
                dot.style.transform = `translateY(${targetDist}px) scale(${scale})`;
            });

            tiltTimeout = setTimeout(() => {
                dots.forEach((dot, idx) => {
                    dot.style.transform = '';
                    arms[idx].style.zIndex = '';
                });
                document.body.classList.add('auto-mode');
            }, 1500);
        });
    })();


    /* =========================================================================
       3. लटकते हुए रेशमी धागों का कोड (मूल कोड - बिना किसी बदलाव के)
       ========================================================================= */
    (() => {
        class Vector {
          constructor(x = 0, y = 0) {
            this.x = x;
            this.y = y;
          }

          static sub(v1, v2) {
            return new Vector(v1.x - v2.x, v1.y - v2.y);
          }

          add(v) {
            this.x += v.x;
            this.y += v.y;
            return this;
          }

          sub(v) {
            this.x -= v.x;
            this.y -= v.y;
            return this;
          }

          mult(n) {
            this.x *= n;
            this.y *= n;
            return this;
          }

          setXY(x, y) {
            this.x = x;
            this.y = y;
            return this;
          }

          dist(v) {
            const dx = this.x - v.x;
            const dy = this.y - v.y;
            return Math.sqrt(dx * dx + dy * dy);
          }
        }

        class Mouse {
          constructor() {
            this.pos = new Vector(-1000, -1000);
            this.radius = 65;

            window.addEventListener('mousemove', (e) => {
              this.pos.setXY(e.clientX, e.clientY);
            });

            window.addEventListener('mouseleave', () => {
              this.pos.setXY(-1000, -1000);
            });

            window.addEventListener('touchmove', (e) => {
              if (e.touches.length > 0) {
                this.pos.setXY(e.touches[0].clientX, e.touches[0].clientY);
              }
            }, { passive: true });

            window.addEventListener('touchend', () => {
              this.pos.setXY(-1000, -1000);
            });
          }
        }

        function createTinyDotSprite() {
          const sprite = document.createElement('canvas');
          const size = 12;
          sprite.width = size;
          sprite.height = size;
          const sCtx = sprite.getContext('2d');
          const center = size / 2;

          const grad = sCtx.createRadialGradient(center, center, 0, center, center, center);
          grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
          grad.addColorStop(0.35, 'rgba(235, 242, 255, 0.55)');
          grad.addColorStop(0.7, 'rgba(200, 215, 255, 0.12)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          sCtx.fillStyle = grad;
          sCtx.fillRect(0, 0, size, size);

          sCtx.fillStyle = '#ffffff';
          sCtx.beginPath();
          sCtx.arc(center, center, 1.35, 0, Math.PI * 2);
          sCtx.fill();

          return sprite;
        }

        const DOT_SPRITE = createTinyDotSprite();

        class Dot {
          constructor(x, y) {
            this.pos = new Vector(x, y);
            this.oldPos = new Vector(x, y);
            this.friction = 0.97;
            this.gravity = new Vector(0, 0.58);
            this.mass = 1;
            this.pinned = false;
            this.dotSize = 6;
          }

          update(mouse) {
            if (this.pinned) return;

            let vel = Vector.sub(this.pos, this.oldPos);
            this.oldPos.setXY(this.pos.x, this.pos.y);

            vel.mult(this.friction);
            vel.add(this.gravity);
            this.pos.add(vel);

            let dx = mouse.pos.x - this.pos.x;
            let dy = mouse.pos.y - this.pos.y;
            const distSq = dx * dx + dy * dy;

            if (distSq < mouse.radius * mouse.radius && distSq > 0) {
              const dist = Math.sqrt(distSq);
              const force = (mouse.radius - dist) / mouse.radius;
              const pushX = (dx / dist) * force * 2.4;
              const pushY = (dy / dist) * force * 2.4;
              this.pos.x -= pushX;
              this.pos.y -= pushY;
            }
          }

          drawPoint(ctx) {
            ctx.drawImage(
              DOT_SPRITE,
              this.pos.x - this.dotSize / 2,
              this.pos.y - this.dotSize / 2,
              this.dotSize,
              this.dotSize
            );
          }
        }

        class Stick {
          constructor(p1, p2) {
            this.startPoint = p1;
            this.endPoint = p2;
            this.length = this.startPoint.pos.dist(this.endPoint.pos);
            this.tension = 0.35;
          }

          update() {
            const dx = this.endPoint.pos.x - this.startPoint.pos.x;
            const dy = this.endPoint.pos.y - this.startPoint.pos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist === 0) return;

            const diff = (dist - this.length) / dist;
            const offsetX = dx * diff * this.tension;
            const offsetY = dy * diff * this.tension;

            if (!this.startPoint.pinned) {
              this.startPoint.pos.x += offsetX * 0.5;
              this.startPoint.pos.y += offsetY * 0.5;
            }
            if (!this.endPoint.pinned) {
              this.endPoint.pos.x -= offsetX * 0.5;
              this.endPoint.pos.y -= offsetY * 0.5;
            }
          }
        }

        class Rope {
          constructor(config) {
            this.x = config.x;
            this.y = config.y;
            this.segments = config.segments || 10;
            this.gap = config.gap || 15;
            this.dots = [];
            this.sticks = [];
            this.iterations = 7;

            this.create();
          }

          pin(index) {
            this.dots[index].pinned = true;
          }

          create() {
            for (let i = 0; i < this.segments; i++) {
              this.dots.push(new Dot(this.x, this.y + i * this.gap));
            }
            for (let i = 0; i < this.segments - 1; i++) {
              this.sticks.push(new Stick(this.dots[i], this.dots[i + 1]));
            }
          }

          update(mouse) {
            for (let i = 0; i < this.dots.length; i++) {
              this.dots[i].update(mouse);
            }
            for (let iter = 0; iter < this.iterations; iter++) {
              for (let j = 0; j < this.sticks.length; j++) {
                this.sticks[j].update();
              }
            }
          }

          drawThread(ctx) {
            ctx.moveTo(this.dots[0].pos.x, this.dots[0].pos.y);
            for (let i = 1; i < this.dots.length; i++) {
              ctx.lineTo(this.dots[i].pos.x, this.dots[i].pos.y);
            }
          }

          drawEndPoint(ctx) {
            this.dots[this.dots.length - 1].drawPoint(ctx);
          }
        }

        class App {
          constructor() {
            this.canvas = document.getElementById('threadsCanvas');
            this.ctx = this.canvas.getContext('2d');
            this.mouse = new Mouse();
            this.ropes = [];

            this.resize();
            window.addEventListener('resize', () => this.resize());
          }

          createRopes() {
            this.ropes = [];
            const total = Math.floor(this.width * 0.42);

            for (let i = 0; i < total; i++) {
              const x = this.randomBetween(this.width * 0.08, this.width * 0.92);
              const y = 0;
              const gap = this.randomBetween(this.height * 0.018, this.height * 0.042);
              const segments = 10;

              const rope = new Rope({ x, y, gap, segments });
              rope.pin(0);
              this.ropes.push(rope);
            }
          }

          resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            this.width = window.innerWidth;
            this.height = window.innerHeight;

            this.canvas.width = this.width * dpr;
            this.canvas.height = this.height * dpr;
            this.ctx.scale(dpr, dpr);

            this.createRopes();
          }

          randomBetween(min, max) {
            return Math.random() * (max - min) + min;
          }

          render() {
            this.ctx.clearRect(0, 0, this.width, this.height);

            this.ctx.beginPath();
            this.ctx.strokeStyle = 'rgba(175, 180, 195, 0.28)';
            this.ctx.lineWidth = 0.75;

            for (let i = 0; i < this.ropes.length; i++) {
              this.ropes[i].update(this.mouse);
              this.ropes[i].drawThread(this.ctx);
            }
            this.ctx.stroke();

            for (let i = 0; i < this.ropes.length; i++) {
              this.ropes[i].drawEndPoint(this.ctx);
            }

            requestAnimationFrame(() => this.render());
          }
        }

        const app = new App();
        app.render();
    })();
</script>
